# zap-to-text — single local container.
# Usage: ./up.sh
#   or: docker compose --env-file .env up -d --build
#
# No custom network needed: Compose creates one default bridge for this project.
# The container only makes outbound WhatsApp + OpenAI connections.

name: zap-to-text

services:
  zap-to-text:
    build:
      context: ./app
    image: zap-to-text:local
    container_name: zap-to-text
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # TRANSCRIBE_GROUP_JID comes from env_file (.env) — required for transcription
      - AUTH_DIR=/app/data/auth
      - SEEN_IDS_PATH=/app/data/seen-ids.json
      - TRANSCRIPTS_DIR=/app/transcripts
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
      - ./transcripts:/app/transcripts
    # No published ports
